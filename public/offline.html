<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#15161c" />
    <title>Offline — Color Context</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#15161c;color:#faf7ee;font:17px/1.55 system-ui,sans-serif}.panel{max-width:640px;border:2px solid #faf7ee;padding:clamp(28px,7vw,64px);box-shadow:10px 10px 0 #c7f23a}.mark{font-size:48px;color:#c7f23a}h1{font:900 clamp(38px,8vw,64px)/1 "Arial Black",system-ui,sans-serif;letter-spacing:-.05em}p{color:#c7c8c3}a{display:inline-block;min-height:48px;margin-top:14px;padding:11px 18px;border:2px solid #faf7ee;background:#c7f23a;color:#15161c;font-weight:800;text-decoration:none}a:focus{outline:3px solid #a997ff;outline-offset:4px}
    </style>
  </head>
  <body><main class="panel"><div class="mark" aria-hidden="true">⌁</div><h1>You’re offline.</h1><p>The saved workbench is normally available without a connection. If this is your first visit, reconnect once so Color Context can store the app on this device.</p><a href="/">Try the workbench again</a></main></body>
</html>
